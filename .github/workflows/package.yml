name: Package and Publish Extension

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      - name: Install the Dependencies
        run: npm ci --ignore-scripts

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: ${{ github.ref_type == 'tag' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi

      - name: Lint Checks
        run: npm run lint-check && npm run md-lint && npm run md-spellcheck && npm run compile
        timeout-minutes: 5

      - name: Package the Extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npx --no-install vsce package -o "fetch-client-$VERSION.vsix"

      - name: Upload the VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: fetch-client-*.vsix
          if-no-files-found: error

  release:
    needs: build
    if: ${{ github.ref_type == 'tag' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create GitHub Release
      id-token: write # cosign keyless signing
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          persist-credentials: false

      - name: Use Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      - name: Install the Dependencies
        run: npm ci --ignore-scripts

      - name: Download the VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the VSIX
        run: cosign sign-blob --yes --bundle "fetch-client-$VERSION.vsix.sigstore" "fetch-client-$VERSION.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            fetch-client-${{ needs.build.outputs.version }}.vsix
            fetch-client-${{ needs.build.outputs.version }}.vsix.sigstore

      - name: Check publish tokens
        id: tokens
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
        run: |
          [ -n "$VSCE_PAT" ] && echo "vsce=true" >> "$GITHUB_OUTPUT"
          [ -n "$OVSX_PAT" ] && echo "ovsx=true" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish to VS Marketplace
        if: ${{ steps.tokens.outputs.vsce == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
        run: npx --no-install vsce publish --packagePath "fetch-client-$VERSION.vsix"

      - name: Publish to Open VSX
        if: ${{ steps.tokens.outputs.ovsx == 'true' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
        run: npx --no-install ovsx publish "fetch-client-$VERSION.vsix"
